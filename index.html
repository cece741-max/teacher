<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2748a3">
<title>Mobil Yoklama - Öğretmen Paneli</title>
<style>
:root{--bg:#eef1f4;--sf:#fff;--soft:#f6f8fa;--ink:#16212b;--mut:#5d6b78;--line:#dde3e9;--pr:#2748a3;--ok:#1f7a52;--okb:#e8f5ee;--bad:#c0392f}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--sf:#18212b;--soft:#1f2a36;--ink:#e8edf2;--mut:#9aa8b5;--line:#2a3745;--pr:#5b7fe0;--ok:#3cb27c;--okb:#16322a;--bad:#ef6f64}}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--ink);font-size:16px;max-width:600px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;min-width:0}
.brand i{width:12px;height:24px;border-radius:3px;background:var(--pr);flex:none}
#bc{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:10px;line-height:1.2;min-width:0}
#bc b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bc span{font-size:12px;font-weight:500;color:var(--mut)}
.hb{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--sf);border-radius:10px;font-size:14px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 5px}
select,input,textarea{width:100%;min-height:46px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.start{width:100%;min-height:56px;background:var(--pr);color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:700;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{min-height:44px;padding:0 14px;font-size:14px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.btn.s{background:var(--pr);border-color:var(--pr);color:#fff}.btn.d{background:var(--sf);border-color:#e3b3ae;color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}
.link{border:0;background:none;color:var(--pr);font-weight:600;font-size:14px;min-height:36px}
.ch{display:flex;justify-content:space-between;align-items:center}.ch label{margin:0}
.sticky{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:var(--bg);padding:6px 0 2px}
#st{display:block;font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;background:var(--okb);border:1px solid var(--ok);color:var(--ok);margin-bottom:10px}
#st.err{background:var(--sf);border-color:var(--bad);color:var(--bad)}
.lh{display:flex;align-items:center;gap:14px;margin-bottom:8px}.lh strong{font-size:28px}.lh span{font-size:14px;color:var(--mut)}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;min-height:36px;border:0;background:none;border-radius:8px;font-size:14px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--sf);color:var(--ink)}
.list{background:var(--sf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.si{display:flex;align-items:center;gap:8px;min-height:42px;padding:3px 10px 3px 8px;border-bottom:1px solid var(--line);border-left:4px solid transparent;cursor:pointer;user-select:none}
.si:last-child{border-bottom:0}.si.on{background:var(--okb);border-left-color:var(--ok)}
.no{font-size:13px;color:var(--mut);min-width:9ch;font-variant-numeric:tabular-nums}.nm{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:9px;white-space:nowrap}.db.g{background:#d3efe0;color:#16603f}.db.r{background:#fbdcd8;color:#9b2c24}.db.m{background:#e1e7f5;color:#27408b}
.hb2{min-width:34px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:99px;font-size:13px;background:var(--line);color:var(--mut)}.hb2.ok{background:var(--ok);color:#fff}
.em{padding:26px 16px;text-align:center;color:var(--mut);font-size:14px}
.abar{display:none;position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--line);z-index:50}
.abar .btn{min-height:52px;font-size:16px}
.ov{display:none;position:fixed;inset:0;background:rgba(10,18,28,.5);justify-content:center;align-items:flex-end;z-index:1000}
.mb{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.mt{font-size:18px;font-weight:700;margin-bottom:6px}.hint{font-size:13px;color:var(--mut)}
.hi{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
body:not(.live) #liveArea,body:not(.live) #bQr{display:none}body.live #setup,body.live #bSet{display:none}body.live .abar{display:flex}
body.nc #setup,body.nc #liveArea{display:none}
table{border-collapse:collapse;font-size:12px;text-align:center;width:100%}th{background:var(--pr);color:#fff;padding:5px}td{padding:5px;border-bottom:1px solid var(--line)}
.x{overflow-x:auto;max-height:70vh}.l{text-align:left}
#sheet{display:none;position:fixed;inset:0;z-index:1300;background:#d1d5db;overflow:auto;padding-bottom:20px}
#sheet .sb{position:sticky;top:0;display:flex;gap:8px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--line);z-index:2}#sheet .sb .btn{flex:1}
#pg{background:#fff;color:#000;width:170mm;height:275mm;margin:12px auto;overflow:hidden;font-family:Arial,Helvetica,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#pg *{color:#000;font-family:Arial,Helvetica,sans-serif}
#pg table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #000}
#pg th,#pg td{border:1px solid #000;padding:0 3px;line-height:1;overflow:hidden;white-space:nowrap;text-align:left;background:#fff}
#pg th{text-align:center;font-size:9px;height:9mm;white-space:normal;line-height:1.1}#pg td.c{text-align:center}
#pg tbody tr:nth-child(5n) td{border-bottom:1.6px solid #000}
#pg .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:3mm}
#pg h1{font-size:17px;margin:0 0 4px}#pg .sh p{font-size:11px;margin:0 0 3px}#pg .sh img{width:26mm;height:26mm;display:block}
@media print{@page{size:A4 portrait;margin:0}
html,body{background:#fff!important;padding:0!important;margin:0!important;max-width:none!important}
body>*:not(#sheet){display:none!important}
#sheet{display:block!important;position:static;background:#fff;overflow:visible;padding:0}#sheet .sb{display:none}
#pg{zoom:1!important;margin:0;box-shadow:none;width:210mm;height:296mm;padding:10mm 20mm;box-sizing:border-box}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="nc">
<header class="top">
 <div class="brand"><i></i>Yoklama<span id="bc"></span></div>
 <div><button class="hb" id="bSet" onclick="settings()">Ayarlar</button> <button class="hb" id="bQr" onclick="qr()">QR kod</button></div>
</header>

<section id="empty" class="card" hidden>
 <h2 style="margin-bottom:6px">İlk dersini ekle</h2>
 <p class="hint">Ders adını ve öğrenci listesini gir, yoklamayı hemen başlat.</p>
 <button class="start" onclick="courseForm(false)">Ders ekle</button>
 <button class="btn" style="width:100%" onclick="$('imp').click()">Yedekten yükle</button>
</section>

<section id="setup" class="card">
 <div class="ch"><label for="sel">Ders</label><button class="link" onclick="courseForm(true)">Dersi düzenle</button></div>
 <select id="sel" onchange="cur=courses[this.value];render()"></select>
 <button class="start" onclick="start()">Yoklamayı başlat</button>
 <div class="tiles">
  <button class="btn" onclick="history_()">Geçmiş</button>
  <button class="btn" onclick="chart(false)">Çizelge</button>
  <button class="btn" onclick="exp()">Yedek al</button>
 </div>
</section>

<div id="liveArea">
 <div class="sticky">
  <span id="st">Yoklama kapalı</span>
  <div class="lh"><div><strong id="sum">0 / 0</strong> <span>katıldı</span></div><div class="bar"><i id="fill"></i></div></div>
  <div class="seg" id="seg"><button data-f="all" onclick="setF('all')"></button><button data-f="in" onclick="setF('in')"></button><button data-f="out" onclick="setF('out')"></button></div>
 </div>
 <div id="list" class="list"></div>
</div>

<div class="abar">
 <button class="btn d" style="flex:0 0 30%" onclick="cancel()">İptal</button>
 <button class="btn s" style="flex:1" onclick="saveSess()">Yoklamayı kaydet</button>
</div>

<div id="sheet"><div class="sb"><button class="btn s" onclick="printSheet()">Yazdır / PDF kaydet</button><button class="btn" onclick="closeSheet()">Kapat</button></div><div id="pg"></div></div>
<input type="file" id="imp" accept=".json" hidden onchange="imp(event)">
<div class="ov" id="ov"><div class="mb" id="mb"></div></div>
<div class="ov" id="cf" style="z-index:1100"><div class="mb" style="max-width:420px">
 <div class="mt">Emin misiniz?</div><p id="ct" class="hint" style="margin:8px 0 6px;font-size:15px"></p>
 <div class="row"><button class="btn" id="cn">Vazgeç</button><button class="btn d" id="cy">Evet</button></div>
</div></div>

<script>
const DEFAULT_DB="https://ogrenciyoklama-ce487-default-rtdb.firebaseio.com",DEFAULT_WEB="https://delicate-gaufre-8c8218.netlify.app";
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const dbUrl=()=>(LS('cfg_firebase')||DEFAULT_DB).trim().replace(/\/+$/,'');
const webUrl=()=>(LS('cfg_web')||DEFAULT_WEB).trim();
let courses=[],cur=null,live=false,ver='',timer=null,filter='all',fails=0,es=null,riskOnly=false;

/* ---------- veri ---------- */
function norm(){courses.forEach((c,i)=>{c.id=c.id||Date.now()+'_'+i;c.credit=+c.credit||3;c.totalWeeks=+c.totalWeeks||15;c.minAttendance=+c.minAttendance||70;c.students=c.students||[];c.pastSessions=c.pastSessions||[];c.students.forEach(s=>{s.isPresent=false;s.distanceMeters=null;s.hours=null;s.qr=false})})}
function load(){try{courses=JSON.parse(LS('CoursePrefs_courses_json')||'[]')}catch(e){courses=[]}if(!Array.isArray(courses))courses=[];norm()}
const save=()=>LS('CoursePrefs_courses_json',JSON.stringify(courses));
const hrs=(c,ss,no)=>ss.studentHoursMap&&ss.studentHoursMap[no]!==undefined?ss.studentHoursMap[no]:(ss.presentStudentNos&&ss.presentStudentNos.includes(no)?c.credit:0);

/* ---------- tarih ---------- */
function pd(s){const m=String(s||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?new Date(+m[1],m[2]-1,+m[3],12):null}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const trd=d=>d?d.toLocaleDateString('tr-TR'):'';
function sdate(c,i){for(let k=i;k>=0;k--){const o=pd((c.pastSessions[k]||{}).dateISO);if(o){o.setDate(o.getDate()+7*(i-k));return o}}const s=pd(c.startDate);if(s){s.setDate(s.getDate()+7*i);return s}return null}

/* ---------- arayüz ---------- */
function status(t,err){const e=$('st');e.textContent=t;e.className=err?'err':''}
function fill(){const s=$('sel');s.innerHTML=courses.map((c,i)=>`<option value="${i}">${esc(c.name)} (${c.credit} saat)${c.instructor?' - '+esc(c.instructor):''}</option>`).join('');
 if(!courses.includes(cur))cur=courses[0]||null;if(cur)s.value=courses.indexOf(cur);render()}
function setF(f){filter=f;render()}
function render(){
 const ss=cur?cur.students:[],cr=cur?cur.credit:3,p=ss.filter(s=>s.isPresent).length;
 document.body.classList.toggle('nc',!courses.length);$('empty').hidden=courses.length>0;
 document.body.classList.toggle('live',live);
 $('sum').textContent=p+' / '+ss.length;$('fill').style.width=ss.length?p/ss.length*100+'%':0;
 const L={all:'Tümü',in:'Gelen',out:'Gelmeyen'},N={all:ss.length,in:p,out:ss.length-p};
 document.querySelectorAll('#seg button').forEach(b=>{b.textContent=L[b.dataset.f]+' '+N[b.dataset.f];b.classList.toggle('on',b.dataset.f===filter)});
 $('bc').innerHTML=cur?`<b>${esc(cur.name)}</b><span>${cur.pastSessions.length+1}. hafta · ${ss.length} öğrenci</span>`:'';
 const box=$('list');box.innerHTML='';
 if(!ss.length)box.innerHTML='<div class="em">Henüz öğrenci yok. Dersi düzenleyip listeyi ekleyin.</div>';
 ss.forEach(s=>{
  if((filter==='in'&&!s.isPresent)||(filter==='out'&&s.isPresent))return;
  const h=s.isPresent?(s.hours!=null?s.hours:cr):0;
  const b=!s.isPresent?'':s.distanceMeters!=null?`<span class="db ${s.distanceMeters<=70?'g':'r'}">${s.distanceMeters} m</span>`:s.qr?'<span class="db m">QR</span>':'<span class="db m">Elden</span>';
  const d=document.createElement('div');d.className='si'+(s.isPresent?' on':'');
  d.innerHTML=`<span class="no">${esc(s.studentNo)}</span><span class="nm">${esc(s.fullName)}</span>${b}<b class="hb2 ${s.isPresent?'ok':''}">${h}</b>`;
  d.onclick=()=>tap(s);d.querySelector('b').onclick=e=>{e.stopPropagation();cycle(s)};box.appendChild(d)});
}
function openM(h){$('mb').innerHTML=h;$('ov').style.display='flex'}
function closeM(){$('ov').style.display='none'}
const ask=(t,y)=>new Promise(r=>{$('ct').textContent=t;$('cy').textContent=y||'Evet';$('cf').style.display='flex';
 $('cy').onclick=()=>{$('cf').style.display='none';r(true)};$('cn').onclick=()=>{$('cf').style.display='none';r(false)}});

/* ---------- öğrenci işlemleri ---------- */
async function unmark(s){
 if(s.qr){try{await fetch(`${dbUrl()}/sessions/${cur.id}/attendance/${encodeURIComponent(s.studentNo)}.json`,{method:'DELETE'})}catch(e){console.error(e)}}
 s.isPresent=false;s.qr=false;s.distanceMeters=null;s.hours=null}
async function tap(s){
 if(s.isPresent){if(s.qr&&!(await ask(s.fullName+' QR ile katılmış. Gelmedi olarak işaretlensin mi?','Katılımı kaldır')))return;await unmark(s)}
 else{s.isPresent=true;s.hours=null;s.distanceMeters=null}
 render()}
async function cycle(s){
 const cr=cur.credit,h=s.isPresent?(s.hours!=null?s.hours:cr):0,n=(h+1)%(cr+1);
 if(n===0)await unmark(s);else{s.isPresent=true;s.hours=n}
 render()}

/* ---------- yoklama oturumu ---------- */
function getLoc(){return new Promise(r=>{if(!navigator.geolocation)return r(null);
 navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{enableHighAccuracy:true,timeout:5000,maximumAge:0})})}

async function start(){
 if(!cur)return alert('Önce bir ders seçin!');
 live=true;ver=Date.now()+'';fails=0;
 cur.students.forEach(s=>{s.isPresent=false;s.qr=false;s.distanceMeters=null;s.hours=null});
 render();status('Sınıf konumu alınıyor…');
 const loc=await getLoc();
 if(!live)return;
 const ok=await push(loc);
 if(!ok){live=false;render();return}
 status(cur.name+' · Yoklama aktif'+(loc?'':' (konum alınamadı)'));
 poll()}

async function push(loc){
 const c=cur,past=c.pastSessions,held=past.filter(x=>!x.isHoliday),obj={};
 c.students.forEach(s=>{
  let att=0;const hist=[];
  past.forEach((ss,i)=>{
   if(ss.isHoliday)return;
   const a=hrs(c,ss,s.studentNo)>0;if(a)att++;
   hist.push({week:(i+1)+'. Hafta',date:trd(sdate(c,i)),status:a?'Var':'Yok',attended:a})});
  obj[s.studentNo]={studentNo:s.studentNo,name:s.fullName,pastAttended:att,history:hist}});
 const payload={courseName:c.name,week:(past.length+1)+'. Hafta',totalPastWeeks:held.length,sessionVersion:ver,active:true};
 if(loc)payload.location={lat:loc.lat,lng:loc.lng,radiusMeters:100000};
 const B=`${dbUrl()}/sessions/${c.id}`;
 const send=async(path,method,body)=>{const r=await fetch(`${B}/${path}.json`,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120))};
 try{
  await send('attendance','DELETE');
  await send('students','PUT',obj);
  await send('public','PUT',payload);
  return true}
 catch(e){status('Firebase HATA',true);alert("Firebase'e yazılamadı: "+e.message+"\n\nFirebase Rules ve veritabanı adresini kontrol edin.");return false}}

function poll(){
 clearInterval(timer);
 timer=setInterval(async()=>{
  if(!live||!cur)return;
  try{
   const r=await fetch(`${dbUrl()}/sessions/${cur.id}/attendance.json`,{cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   if(fails>=3)status(cur.name+' · Yoklama aktif');
   fails=0;const d=await r.json();
   if(d){let u=false;
    for(const no in d){
     const s=cur.students.find(x=>x.studentNo===no);if(!s)continue;
     const dist=d[no].distanceMeters==null?null:d[no].distanceMeters;
     if(!s.qr||!s.isPresent||s.distanceMeters!==dist){s.isPresent=true;s.qr=true;s.distanceMeters=dist;u=true}}
    if(u)render()}
  }catch(e){if(++fails===3)status('Bağlantı sorunu: '+e.message,true)}
 },2000)}

async function endLive(){
 live=false;clearInterval(timer);
 if(cur){cur.students.forEach(s=>{s.isPresent=false;s.qr=false;s.distanceMeters=null;s.hours=null});
  for(const k of ['attendance','students','public']){try{await fetch(`${dbUrl()}/sessions/${cur.id}/${k}.json`,{method:'DELETE'})}catch(e){console.error(e)}}}
 status('Yoklama kapalı');render()}
async function saveSess(){
 if(!live)return;const c=cur,hm={},dm={};
 c.students.forEach(s=>{if(s.isPresent){hm[s.studentNo]=s.hours!=null?s.hours:c.credit;if(s.distanceMeters!=null)dm[s.studentNo]=s.distanceMeters}});
 c.pastSessions.push({id:Date.now()+'',date:(c.pastSessions.length+1)+'. Hafta',dateISO:iso(new Date()),presentStudentNos:Object.keys(hm),studentHoursMap:hm,studentDistancesMap:dm});
 save();await endLive();alert('Yoklama kaydedildi!')}
async function cancel(){if(await ask('Yoklama kaydedilmeden kapatılacak. Devam edilsin mi?','Kaydetmeden çık'))endLive()}

/* ---------- ders formu ---------- */
function courseForm(edit){
 const c=edit?cur:{};if(edit&&!cur)return;
 const list=edit?(c.classListText||c.students.map(s=>s.studentNo+'\t'+s.fullName).join('\n')):'';
 openM(`<div class="mt">${edit?esc(c.name)+' - Düzenle':'Yeni ders'}</div>
 <label>Ders adı</label><input id="fN" value="${esc(c.name||'')}" placeholder="Örn: İktisada Giriş">
 <label>Öğretim elemanı</label><input id="fI" value="${esc(c.instructor||'')}">
 <div class="g3"><div><label>Saat</label><input id="fC" type="number" value="${c.credit||3}"></div><div><label>Hafta</label><input id="fW" type="number" value="${c.totalWeeks||15}"></div><div><label>Devam %</label><input id="fM" type="number" value="${c.minAttendance||70}"></div></div>
 <label>Başlangıç tarihi</label><input id="fS" type="date" value="${esc(c.startDate||'')}">
 <label>Öğrenci listesi (numara ad soyad)</label><textarea id="fL" placeholder="20241010 Ahmet Yılmaz">${esc(list)}</textarea>
 ${edit?'<div class="row" style="margin-top:12px"><button class="btn" onclick="sheet()">Yoklama kağıdı (PDF)</button></div>':''}
 <div class="row"><button class="btn s" onclick="saveCourse(${edit})">Kaydet</button>${edit?'<button class="btn d" onclick="delCourse()">Dersi sil</button>':''}<button class="btn" onclick="closeM()">İptal</button></div>`)}
function parseList(t){const a=[];t.split('\n').forEach(l=>{const m=l.trim().match(/^(\S+?)[\s,;]+(.+)$/);if(m&&m[2].trim())a.push({studentNo:m[1].trim(),fullName:m[2].trim(),isPresent:false,distanceMeters:null,hours:null,qr:false})});return a}
function saveCourse(edit){
 const name=$('fN').value.trim();if(!name)return alert('Ders adı boş olamaz!');
 const f={name,instructor:$('fI').value.trim(),credit:+$('fC').value||3,totalWeeks:Math.max(1,Math.min(30,+$('fW').value||15)),minAttendance:Math.max(1,Math.min(100,+$('fM').value||70)),startDate:$('fS').value,classListText:$('fL').value.trim()};
 let c;
 if(edit)c=cur;else{c={id:Date.now()+'',students:[],pastSessions:[]};courses.push(c)}
 const old={};c.students.forEach(s=>old[s.studentNo]=s);
 Object.assign(c,f);
 if(f.classListText){const past=c.pastSessions.length;c.students=parseList(f.classListText);c.students.forEach(s=>{const o=old[s.studentNo];s.joinWeek=o?(o.joinWeek||0):(edit?past:0)})}
 cur=c;save();fill();closeM()}
async function delCourse(){
 if(!(await ask(cur.name+' dersi ve tüm yoklama kayıtları silinecek.','Dersi sil')))return;
 courses.splice(courses.indexOf(cur),1);cur=courses[0]||null;save();fill();closeM()}

/* ---------- geçmiş ---------- */
function history_(){
 if(!cur||!cur.pastSessions.length)return alert('Bu derse ait geçmiş yoklama yok.');
 openM(`<div class="mt">${esc(cur.name)} - Geçmiş</div><p class="hint" style="margin-bottom:6px">Düzenlemek için haftaya dokunun.</p>`+
 cur.pastSessions.map((ss,i)=>{const n=cur.students.filter(s=>hrs(cur,ss,s.studentNo)>0).length,d=sdate(cur,i);
  return `<div class="hi" onclick="editSess(${i})"><div><b>${i+1}. Hafta${d?' · '+trd(d):''}</b><div class="hint">${ss.isHoliday?'Ders yapılmadı':'Katılan: '+n+' / '+cur.students.length}</div></div><button class="btn">Düzenle</button></div>`}).join('')+
 `<div class="row"><button class="btn" onclick="closeM()">Kapat</button></div>`)}
function editSess(i){
 const ss=cur.pastSessions[i],m={};cur.students.forEach(s=>m[s.studentNo]=hrs(cur,ss,s.studentNo));
 const d=sdate(cur,i);es={i,m,h:!!ss.isHoliday,t:ss.date||(i+1)+'. Hafta',d:d?iso(d):''};drawEdit()}
function drawEdit(){
 const n=cur.students.filter(s=>es.m[s.studentNo]>0).length;
 openM(`<div class="mt">${esc(cur.name)} (${es.i+1}. Hafta)</div>
 <label>Başlık</label><input id="eT" value="${esc(es.t)}"><label>Tarih</label><input id="eD" type="date" value="${esc(es.d)}">
 <label style="display:flex;align-items:center;gap:10px;margin:14px 0 6px;font-size:15px;color:var(--ink)"><input type="checkbox" id="eH" ${es.h?'checked':''} onchange="togH()" style="width:22px;min-height:22px;flex:none">Ders yapılmadı (tatil / iptal)</label>
 <p class="hint" style="margin:6px 0 6px">${es.h?'Bu hafta devam hesabına ve öğrenci ekranına <b>dahil edilmez</b>.':'<b>Katılan: '+n+' / '+cur.students.length+'</b> · saat için rozete dokunun'}</p>
 <div class="list" style="${es.h?'opacity:.4;pointer-events:none':''}">${cur.students.map(s=>{const h=es.m[s.studentNo];return `<div class="si" onclick="cycEdit('${esc(s.studentNo)}')"><span class="no">${esc(s.studentNo)}</span><span class="nm">${esc(s.fullName)}</span><b class="hb2 ${h>0?'ok':''}">${h}</b></div>`}).join('')}</div>
 <div class="row"><button class="btn s" onclick="saveEdit()">Kaydet</button><button class="btn d" onclick="delEdit()">Sil</button><button class="btn" onclick="history_()">Geri</button></div>`);}
function togH(){es.t=$('eT').value;es.d=$('eD').value;es.h=$('eH').checked;drawEdit()}
function cycEdit(no){es.t=$('eT').value;es.d=$('eD').value;es.m[no]=((es.m[no]||0)+1)%(cur.credit+1);const y=$('mb').scrollTop;drawEdit();$('mb').scrollTop=y}
function saveEdit(){
 const ss=cur.pastSessions[es.i];ss.date=$('eT').value.trim()||ss.date;const d=$('eD').value;if(d)ss.dateISO=d;else delete ss.dateISO;
 if(es.h)ss.isHoliday=true;else delete ss.isHoliday;
 ss.studentHoursMap=es.m;ss.presentStudentNos=Object.keys(es.m).filter(k=>es.m[k]>0);save();history_()}
async function delEdit(){if(!(await ask('Bu haftanın yoklama kaydı silinecek.','Kaydı sil')))return;cur.pastSessions.splice(es.i,1);save();cur.pastSessions.length?history_():closeM()}

/* ---------- çizelge ---------- */
function chart(r){
 if(!cur)return;riskOnly=r;const c=cur,cr=c.credit,H=c.pastSessions.map((x,i)=>i).filter(i=>!c.pastSessions[i].isHoliday),pl=H.length,al=Math.floor(c.totalWeeks*cr*(100-c.minAttendance)/100+1e-9);
 const rows=c.students.map((s,i)=>{const j=s.joinWeek||0;let att=0,poss=0;const cells=[];
  H.forEach(w=>{if(w<j){cells.push(null);return}const h=hrs(c,c.pastSessions[w],s.studentNo);att+=h;poss+=cr;cells.push(h)});
  const rem=al-Math.max(0,poss-att);return{s,i,cells,att,poss,rem,st:rem<0?'over':rem<=al*.25?'risk':'ok'}});
 const show=r?rows.filter(x=>x.st!=='ok'):rows,fin=pl>=c.totalWeeks,CL={ok:'#2e7d32',risk:'#e65100',over:'#c62828'};
 let h=`<div class="mt">${esc(c.name)} - Devam çizelgesi</div><p class="hint">${pl}/${c.totalWeeks}. hafta · sınır %${c.minAttendance} (en fazla ${al} saat devamsızlık)</p>
 <div class="seg" style="margin:8px 0"><button class="${r?'':'on'}" onclick="chart(false)">Tümü ${rows.length}</button><button class="${r?'on':''}" onclick="chart(true)">Riskliler ${rows.filter(x=>x.st!=='ok').length}</button></div>
 <div class="x"><table><thead><tr><th>#</th><th class="l">Öğrenci</th>`;
 H.forEach(w=>{const d=sdate(c,w);h+=`<th>H${w+1}${d?`<br><small>${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}</small>`:''}</th>`});
 h+=`<th>Katılım</th><th>%</th><th>Kalan</th><th>Durum</th></tr></thead><tbody>`;
 if(!show.length)h+=`<tr><td colspan="${pl+6}" style="padding:16px">Gösterilecek öğrenci yok.</td></tr>`;
 show.forEach(x=>{
  const lb=fin?(x.st==='over'?'Sağlamadı':'Sağladı'):{ok:'Güvende',risk:'Risk',over:'Sınır aşıldı'}[x.st];
  h+=`<tr><td>${x.i+1}</td><td class="l"><b>${esc(x.s.fullName)}</b><br><small>${esc(x.s.studentNo)}</small></td>`+
  x.cells.map(v=>v===null?'<td>–</td>':v>0?`<td style="background:#c8e6c9;color:#2e7d32"><b>${v}</b></td>`:'<td style="background:#ffcdd2;color:#c62828"><b>0</b></td>').join('')+
  `<td><b>${x.att}/${x.poss}</b></td><td><b>${x.poss?'%'+Math.round(x.att/x.poss*100):'-'}</b></td><td style="color:${CL[x.st]}"><b>${x.rem>=0?x.rem:(-x.rem)+' aştı'}</b></td><td style="color:${CL[fin&&x.st!=='over'?'ok':x.st]}"><b>${lb}</b></td></tr>`});
 openM(h+`</tbody></table></div><div class="row"><button class="btn" onclick="closeM()">Kapat</button></div>`)}

/* ---------- yoklama kağıdı ---------- */
function sheet(){
 const c=cur;if(!c)return;
 const n=Math.max(c.students.length,1),cr=Math.max(1,c.credit),yr=new Date().getFullYear();
 const t=document.createElement('div');t.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(t);
 new QRCode(t,{text:`${webUrl()}?session=${c.id}`,width:300,height:300,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
 const cv=t.querySelector('canvas'),im=t.querySelector('img'),src=cv?cv.toDataURL('image/png'):(im?im.src:'');t.remove();
 const rh=Math.min(8.2,232/n),fs=Math.max(5.5,Math.min(10.5,rh*3.78*.55));
 const rows=Array.from({length:n},(_,i)=>{const s=c.students[i];return `<tr style="height:${rh.toFixed(2)}mm;font-size:${fs.toFixed(1)}px"><td class="c">${i+1}</td><td class="c">${s?esc(s.studentNo):''}</td><td>${s?esc(s.fullName):''}</td><td></td><td></td><td></td></tr>`}).join('');
 $('pg').innerHTML=`<div class="sh"><div><h1>${esc(c.name)} - Yoklama Listesi</h1>${c.instructor?`<p>Öğretim Elemanı: ${esc(c.instructor)}</p>`:''}<p>Ders Kredisi: ${cr} saat · ${cr===3?'Tek haftalık liste (her saat için imza)':'3 haftalık liste (her hafta için tek imza)'}</p></div>${src?`<img src="${src}" alt="QR">`:''}</div>
 <table><colgroup><col style="width:9mm"><col style="width:24mm"><col><col style="width:22mm"><col style="width:22mm"><col style="width:22mm"></colgroup><thead><tr><th>Sıra</th><th>Öğrenci No</th><th>Ad Soyad</th>${('<th>..../..../'+yr+'</th>').repeat(3)}</tr></thead><tbody>${rows}</tbody></table>`;
 $('sheet').style.display='block';$('sheet').scrollTop=0;fitSheet()}
function fitSheet(){$('pg').style.zoom=Math.min(1,($('sheet').clientWidth-24)/(170*3.7795))}
function printSheet(){const t=document.title;document.title=cur.name+' - Yoklama Listesi';window.onafterprint=()=>{document.title=t;window.onafterprint=null};window.print()}
function closeSheet(){$('sheet').style.display='none'}
addEventListener('resize',()=>{if($('sheet').style.display==='block')fitSheet()});

/* ---------- QR / ayarlar / yedek ---------- */
function qr(){
 if(!cur)return;const url=`${webUrl()}?session=${cur.id}`;
 openM(`<div class="mt">${esc(cur.name)} - QR kod</div><p class="hint">Bu derse ait sabit QR koddur; çıktısını alıp kullanabilirsiniz.</p><div id="qrc" style="display:flex;justify-content:center;margin:16px 0;background:#fff;padding:12px;border-radius:12px"></div><div class="row"><button class="btn" onclick="closeM()">Kapat</button></div>`);
 new QRCode($('qrc'),{text:url,width:240,height:240})}
function settings(){
 openM(`<div class="mt">Sistem ayarları</div>
 <label>Firebase Database URL</label><input id="cF" value="${esc(dbUrl())}" placeholder="https://...">
 <label>Öğrenci giriş sayfası URL</label><input id="cW" value="${esc(webUrl())}" placeholder="https://...">
 <p class="hint" style="margin-top:6px">Not: öğrenci sayfasında Firebase adresi sabittir; burada değiştirirseniz orayı da güncelleyin.</p>
 <label>Dersler ve yedek</label>
 <div class="row" style="margin-top:0"><button class="btn" onclick="courseForm(false)">+ Yeni ders</button><button class="btn" onclick="exp()">Yedek al</button><button class="btn" onclick="$('imp').click()">Yükle</button></div>
 <label>Tehlikeli bölge</label><div class="row" style="margin-top:0"><button class="btn d" onclick="wipe()">Tüm verileri sil</button></div>
 <div class="row"><button class="btn s" onclick="saveSet()">Kaydet</button><button class="btn" onclick="closeM()">Kapat</button></div>`)}
function saveSet(){
 const f=$('cF').value.trim(),w=$('cW').value.trim();
 if((f&&!/^https:\/\//.test(f))||(w&&!/^https:\/\//.test(w)))return alert('Adresler https:// ile başlamalı.');
 if(f)LS('cfg_firebase',f);if(w)LS('cfg_web',w);closeM()}
async function wipe(){
 if(live)return alert('Yoklama sürerken silinemez.');
 if(!(await ask('Tüm dersler, listeler ve yoklama kayıtları silinecek. Önce yedek alın.','Tümünü sil')))return;
 if(!(await ask('Emin misiniz? Geri getirilemez.','Evet, sil')))return;
 courses=[];cur=null;['CoursePrefs_courses_json','cfg_firebase','cfg_web'].forEach(k=>LS(k,null));fill();closeM()}
function exp(){
 if(!courses.length)return alert('Yedeklenecek ders yok!');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,settings:{firebaseUrl:dbUrl(),webUrl:webUrl()},courses},null,1)],{type:'application/json'}));
 a.download='yoklama_'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()}
function imp(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{
  let d=JSON.parse(r.result);if(typeof d==='string')d=JSON.parse(d);
  const a=Array.isArray(d)?d:d.courses||d.courseList||(d.terms?d.terms.flatMap(t=>t.courses||[]):null)||(d.name?[d]:[]);
  if(!a.length)return alert('Yedekte ders bulunamadı!');
  courses=a.map(c=>({...c,name:c.name||c.courseName||'Ders',students:(c.students||[]).map(s=>({...s,studentNo:String(s.studentNo||s.studentNumber||'').trim(),fullName:String(s.fullName||s.name||'').trim()}))}));
  norm();const st=d.settings||{};
  if(/^https:\/\//.test(st.firebaseUrl||''))LS('cfg_firebase',st.firebaseUrl.trim());
  if(/^https:\/\//.test(st.webUrl||''))LS('cfg_web',st.webUrl.trim());
  cur=courses[0];save();fill();closeM();alert(courses.length+' ders yüklendi.');
 }catch(x){alert('Yedek okunamadı: '+x.message)}};
 r.readAsText(f)}

load();fill();
</script>
</body>
